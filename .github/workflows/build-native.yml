name: Native ABI build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Version and ABI
        run: |
          set -euo pipefail
          python3 -B scripts/check_release_version.py
          python3 -B test_plugin.py
      - name: Build and exercise final production library
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p build
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fPIC -shared cpa-updater.c -o build/cpa-updater.so
          VERSION=$(python3 -B -c 'import sys; sys.path.insert(0,"scripts"); from check_release_version import source_versions; print(next(iter(source_versions().values())))')
          readelf --version-info build/cpa-updater.so
          python3 -B scripts/smoke_plugin.py --binary build/cpa-updater.so --version "$VERSION" --arch "$RELEASE_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cpa-updater-linux-${{ matrix.arch }}
          path: build/cpa-updater.so
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
