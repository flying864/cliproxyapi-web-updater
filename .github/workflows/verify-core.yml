name: Full isolated verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install test-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc python3 python3-venv curl bubblewrap
      - name: Version, permission and native regressions
        run: |
          set -euo pipefail
          python3 -B scripts/check_release_version.py
          python3 -B tests/test_native.py
          python3 -B tests/test_permissions.py
          python3 -B tests/test_version.py
          python3 -B tests/test_workflows.py
      - name: Syntax, ABI and sanitizer tests
        run: |
          set -euo pipefail
          for script in install.sh uninstall.sh cliproxy-updater-worker; do
            bash -n "$script"
          done
          python3 -B test_plugin.py
          python3 -B tests/test_sanitizer.py
          node tests/test_panel.js
          node tests/test_panel_auth.js
          node tests/test_panel_backups.js
          export TMPDIR="$(mktemp -d "$RUNNER_TEMP/cpa-backup-tests.XXXXXXXX")"
          python3 -B tests/test_backup_manager.py
          python3 -B tests/test_backup_install.py
          python3 -B tests/test_private_json.py
          python3 -B tests/test_hot_install.py
          python3 -B tests/test_hot_cleanup.py
          python3 -B tests/test_update_command.py
      - name: Browser and iframe regressions (test-only environment)
        run: |
          python3 -m venv test-output/browser-env
          test-output/browser-env/bin/pip install playwright==1.64.1
          test-output/browser-env/bin/python -m playwright install --with-deps chromium
          test-output/browser-env/bin/python -B tests/test_panel_browser.py
      - name: Isolated worker and installer regressions
        run: |
          sudo env CPA_TEST_REAL_UID=1 python3 -B tests/test_worker.py
          sudo env CPA_TEST_REAL_UID=1 python3 -B tests/test_backup_worker.py
          sudo env CPA_TEST_REAL_UID=1 python3 -B tests/test_install.py
          python3 -B tests/test_simple_install.py
          sudo python3 -B tests/test_runtime.py
      - name: Pinned official host integration
        run: |
          mkdir -p test-output
          python3 -B tests/fetch_official.py --output test-output/cli-proxy-api
          sudo python3 -B tests/test_official.py --binary test-output/cli-proxy-api --output test-output/official
          sudo python3 -B tests/test_hot_install_official.py --binary test-output/cli-proxy-api --output test-output/hot-install-official
