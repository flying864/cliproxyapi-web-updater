name: Publish store plugin
on:
  push:
    tags: ['v*.*.*']
permissions: {}
concurrency:
  group: store-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify-core.yml
    with:
      release-tag: ${{ github.ref_name }}
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-store.yml
    with:
      release-tag: ${{ github.ref_name }}
  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cpa-updater-linux-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact assets and publish without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/check_release_version.py --tag "$RELEASE_TAG"
          python3 -B scripts/store_artifacts.py verify --version "${RELEASE_TAG#v}" --directory release-assets --create-checksums
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release exists; refusing to overwrite. See STORE_PUBLISHING.md recovery instructions.\n' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/cpa-updater_*.zip release-assets/checksums.txt \
            --verify-tag --latest --title "CPA Web Updater $RELEASE_TAG" \
            --notes 'Linux amd64/arm64 native plugin builds on Ubuntu 24.04 (glibc), not musl. ZIP contains only cpa-updater.so, not the privileged worker. Store directory permissions are NOT changed. See STORE_PUBLISHING.md for setup, compatibility and recovery limits.'
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets > release-state.json
          python3 -B -c 'import json,os; s=json.load(open("release-state.json")); v=os.environ["RELEASE_TAG"]; expected={"checksums.txt",f"cpa-updater_{v[1:]}_linux_amd64.zip",f"cpa-updater_{v[1:]}_linux_arm64.zip"}; assert s["tagName"]==v and not s["isDraft"] and not s["isPrerelease"]; assert len(s["assets"])==3 and {a["name"] for a in s["assets"]}==expected; assert all(a["size"]>0 for a in s["assets"])'
          mkdir release-readback
          gh release download "$RELEASE_TAG" --dir release-readback
          python3 -B scripts/store_artifacts.py verify --version "${RELEASE_TAG#v}" --directory release-readback
          python3 -B -c 'import pathlib; local=pathlib.Path("release-assets"); remote=pathlib.Path("release-readback"); assert all((remote/p.name).read_bytes()==p.read_bytes() for p in local.iterdir() if p.is_file())'
